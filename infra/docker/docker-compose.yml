services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: rag-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Upstream minio/minio images are no longer published on Docker Hub/Quay.
    image: cgr.dev/chainguard/minio:latest
    container_name: rag-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "minio", "--version"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: rag-keycloak
    restart: always
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080" # 8080 is taken by another project's container on this machine
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      # Keycloak 26 moved /health off the main port onto the management port
      # (9000), which isn't published here — this probe just checks the main
      # port accepts connections at all.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  ocr:
    build:
      context: ../ocr
    container_name: rag-ocr
    restart: always
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s # first boot downloads PaddleOCR's detection/recognition models

  clamav:
    image: clamav/clamav:stable
    container_name: rag-clamav
    restart: always
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s # first boot downloads virus definitions — this is slow

  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    restart: always
    extra_hosts:
      # host.docker.internal resolves out of the box on Docker Desktop
      # (macOS/Windows); this makes it also resolve on Linux (e.g. the ML310e
      # deployment target), where it's otherwise not defined.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000" # 3000 is taken by apps/web's Next.js dev server
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  keycloak_data:
  clamav_data:
  prometheus_data:
  grafana_data:
