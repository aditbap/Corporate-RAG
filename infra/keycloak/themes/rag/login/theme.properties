# Keycloak login theme that matches the web app (zinc palette, Inter, card layout, light + dark).
# Extends the stock `keycloak.v2` login theme (Keycloak 26 default, PatternFly 5) and only layers
# css/rag.css and js/theme.js on top (no template changes), so it keeps working across Keycloak upgrades.
parent=keycloak.v2
styles=css/styles.css css/rag.css
scripts=js/theme.js
